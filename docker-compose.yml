services:
  postgres:
    image: postgres:16-alpine
    container_name: news-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_platform}
      POSTGRES_USER: ${DATABASE_USERNAME:-news_platform}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-news_platform_dev}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - news_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_platform -d news_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: news-platform-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-news_platform}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-news_platform}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-news_platform_dev}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-at-least-32-characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      MEDIA_STORAGE_TYPE: ${MEDIA_STORAGE_TYPE:-local}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH:-/data/media}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:8080}
      MAX_IMAGE_UPLOAD_SIZE: ${MAX_IMAGE_UPLOAD_SIZE:-10485760}
      MAX_VIDEO_UPLOAD_SIZE: ${MAX_VIDEO_UPLOAD_SIZE:-52428800}
      BREAKING_NEWS_DEFAULT_DURATION_MINUTES: ${BREAKING_NEWS_DEFAULT_DURATION_MINUTES:-120}
      MAX_NEWSPAPER_PDF_UPLOAD_SIZE: ${MAX_NEWSPAPER_PDF_UPLOAD_SIZE:-104857600}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - news_media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: news-platform-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  news_platform_postgres_data:
  news_media_data:
