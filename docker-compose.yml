services:
  postgres:
    image: postgres:16.4-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_platform}
      POSTGRES_USER: ${DATABASE_USERNAME:-news_platform}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-news_platform_dev}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - news_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-news_platform}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-news_platform}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-news_platform_dev}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-at-least-32-characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-ChangeMe123!}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Platform Admin}
      MEDIA_STORAGE_TYPE: ${MEDIA_STORAGE_TYPE:-local}
      MEDIA_STORAGE_PATH: /data/media
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:8080}
      MAX_IMAGE_UPLOAD_SIZE: ${MAX_IMAGE_UPLOAD_SIZE:-10485760}
      MAX_VIDEO_UPLOAD_SIZE: ${MAX_VIDEO_UPLOAD_SIZE:-52428800}
      MAX_UPLOAD_REQUEST_SIZE: ${MAX_UPLOAD_REQUEST_SIZE:-115343360}
      BREAKING_NEWS_DEFAULT_DURATION_MINUTES: ${BREAKING_NEWS_DEFAULT_DURATION_MINUTES:-120}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      AD_EXPIRING_SOON_HOURS: ${AD_EXPIRING_SOON_HOURS:-24}
      MAX_NEWSPAPER_PDF_UPLOAD_SIZE: ${MAX_NEWSPAPER_PDF_UPLOAD_SIZE:-104857600}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-false}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - news_media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_FEED_AD_INTERVAL: ${FEED_AD_INTERVAL:-5}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  news_platform_postgres_data:
  news_media_data:
