spring:
  application:
    name: news-platform-api
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/news_platform}
    username: ${DATABASE_USERNAME:news_platform}
    password: ${DATABASE_PASSWORD:news_platform_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_NEWSPAPER_PDF_UPLOAD_SIZE:104857600}
      max-request-size: ${MAX_NEWSPAPER_PDF_UPLOAD_SIZE:104857600}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION:3600}
  initial-admin:
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    name: ${INITIAL_ADMIN_NAME:}
  media:
    storage-type: ${MEDIA_STORAGE_TYPE:local}
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    public-url: ${MEDIA_PUBLIC_URL:http://localhost:8080}
    max-image-upload-size: ${MAX_IMAGE_UPLOAD_SIZE:10485760}
    max-video-upload-size: ${MAX_VIDEO_UPLOAD_SIZE:52428800}
  comments:
    max-length: ${COMMENT_MAX_LENGTH:2000}
  breaking-news:
    default-duration-minutes: ${BREAKING_NEWS_DEFAULT_DURATION_MINUTES:120}
  newspaper:
    max-pdf-upload-size: ${MAX_NEWSPAPER_PDF_UPLOAD_SIZE:104857600}
  ads:
    feed-interval: ${FEED_AD_INTERVAL:5}
    expiring-soon-hours: ${AD_EXPIRING_SOON_HOURS:24}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
