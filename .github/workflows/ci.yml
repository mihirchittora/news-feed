name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        working-directory: apps/backend
        run: mvn -B -ntp verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --tag news-platform-backend:ci apps/backend
      - name: Build web image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=https://api.invalid
          --build-arg NEXT_PUBLIC_SITE_URL=https://www.invalid
          --tag news-platform-web:ci apps/web

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Validate staging configuration
        working-directory: infra/environments/staging
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate production configuration
        working-directory: infra/environments/production
        run: |
          terraform init -backend=false -input=false
          terraform validate

  platform-smoke:
    name: Cross-platform toolchain smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Package backend without tests
        working-directory: apps/backend
        run: mvn -B -ntp -DskipTests package
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run lint
      - name: Run frontend tests
        working-directory: apps/web
        run: npm test
