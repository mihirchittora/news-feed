name: Deploy staging

on:
  workflow_run:
    workflows: [Build immutable images]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA whose immutable images should be promoted
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Apply staging and smoke test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    env:
      OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY }}
      OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
      BACKEND_IMAGE_NAME: ${{ vars.BACKEND_IMAGE_NAME || 'news-platform-backend' }}
      WEB_IMAGE_NAME: ${{ vars.WEB_IMAGE_NAME || 'news-platform-web' }}
      TF_HTTP_ADDRESS: ${{ secrets.STAGING_TF_HTTP_ADDRESS }}
      TF_HTTP_USERNAME: ${{ secrets.STAGING_TF_HTTP_USERNAME }}
      TF_HTTP_PASSWORD: ${{ secrets.STAGING_TF_HTTP_PASSWORD }}
      TF_HTTP_LOCK_ADDRESS: ${{ secrets.STAGING_TF_HTTP_LOCK_ADDRESS }}
      TF_HTTP_UNLOCK_ADDRESS: ${{ secrets.STAGING_TF_HTTP_UNLOCK_ADDRESS }}
      TF_HTTP_LOCK_METHOD: POST
      TF_HTTP_UNLOCK_METHOD: DELETE
      TF_HTTP_RETRY_WAIT_MIN: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.commit_sha }}

      - name: Select commit SHA
        id: release
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            image_tag="$WORKFLOW_RUN_SHA"
          else
            image_tag="$DISPATCH_SHA"
          fi
          if [[ ! "$image_tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to OCIR
        env:
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
        run: echo "$OCIR_AUTH_TOKEN" | docker login "$OCIR_REGISTRY" --username "$OCIR_USERNAME" --password-stdin

      - name: Resolve exact image digests
        id: images
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          backend_ref="$OCIR_REGISTRY/$OCIR_NAMESPACE/$BACKEND_IMAGE_NAME:$IMAGE_TAG"
          web_ref="$OCIR_REGISTRY/$OCIR_NAMESPACE/$WEB_IMAGE_NAME:$IMAGE_TAG"
          backend_digest="$(docker buildx imagetools inspect "$backend_ref" --format '{{.Manifest.Digest}}')"
          web_digest="$(docker buildx imagetools inspect "$web_ref" --format '{{.Manifest.Digest}}')"
          test -n "$backend_digest"
          test -n "$web_digest"
          echo "backend_image=$OCIR_REGISTRY/$OCIR_NAMESPACE/$BACKEND_IMAGE_NAME@$backend_digest" >> "$GITHUB_OUTPUT"
          echo "web_image=$OCIR_REGISTRY/$OCIR_NAMESPACE/$WEB_IMAGE_NAME@$web_digest" >> "$GITHUB_OUTPUT"

      - name: Write staging Terraform variables
        env:
          STAGING_TFVARS: ${{ secrets.STAGING_TFVARS }}
        run: |
          test -n "$STAGING_TFVARS"
          printf '%s\n' "$STAGING_TFVARS" > infra/environments/staging/staging.tfvars

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Initialize Terraform remote state
        working-directory: infra/environments/staging
        run: terraform init -input=false

      - name: Plan staging deployment
        working-directory: infra/environments/staging
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: >-
          terraform plan -input=false -out=staging.tfplan
          -var-file=staging.tfvars
          -var "backend_image=$BACKEND_IMAGE"
          -var "web_image=$WEB_IMAGE"
          -var "artifact_tag=$IMAGE_TAG"

      - name: Apply staging deployment
        working-directory: infra/environments/staging
        run: terraform apply -input=false -auto-approve staging.tfplan

      - name: Smoke test staging through the load balancer
        working-directory: infra/environments/staging
        run: |
          base_url="$(terraform output -raw frontend_endpoint)"
          test -n "$base_url"
          for path in /actuator/health/readiness /api/v1/feed /api/v1/categories /api/v1/breaking-news /api/v1/newspapers '/api/v1/ads?placement=HOME_BANNER'; do
            curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$base_url$path" >/dev/null
          done
          echo "staging_url=$base_url" >> "$GITHUB_STEP_SUMMARY"
          echo "promoted_commit=${{ steps.release.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "backend_image=${{ steps.images.outputs.backend_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "web_image=${{ steps.images.outputs.web_image }}" >> "$GITHUB_STEP_SUMMARY"
