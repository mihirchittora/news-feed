name: Build and scan images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-build-${{ github.sha }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE_NAME: news-platform-backend
  WEB_IMAGE_NAME: news-platform-web

jobs:
  build:
    name: Build and scan ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$IMAGE_TAG" \
            --tag "$BACKEND_IMAGE_NAME:$IMAGE_TAG" \
            apps/backend

      - name: Build web image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.invalid \
            --build-arg NEXT_PUBLIC_SITE_URL=https://www.invalid \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$IMAGE_TAG" \
            --tag "$WEB_IMAGE_NAME:$IMAGE_TAG" \
            apps/web

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
